<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>班班正式 UI 隔离验收</title><script type="module" src="./pet-console.js"></script><style>body{font:16px/1.65 system-ui;color:#1f3a5f;background:#f6f3ec;margin:36px}h1{font-size:26px}p{max-width:720px}button{font:inherit;padding:10px 16px;margin:4px;border:1px solid #b9c1ca;border-radius:7px;background:white;color:inherit;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:300px;overflow:auto}#error{color:#a74432}#underlay{padding:20px;border:1px dashed #b9c1ca;margin-top:20px}</style></head><body><h1>班班正式 UI 隔离验收</h1><p>pet-ui-verification-console · 真实桌宠前端与存储提交接缝。本次只使用新建合成工作根，不启用模型、凭据、MCP 或普通工作台。关闭后保留合成数据，30 分钟自动退出。</p><div id="actions"><button data-action="show">显示班班</button><button data-action="hide">隐藏班班</button><button data-action="delayed_found">3 秒后发布候选</button><button data-action="delayed_done">3 秒后完成事项</button><button data-action="found">发布一个候选</button><button data-action="sign_one">签收一个</button><button data-action="discard_one">丢弃一个</button><button data-action="discard_all">丢弃全部</button><button data-action="done">新建并完成</button><button data-action="replay_done">重试同一完成</button><button data-action="reopen">重新打开事项</button><button data-action="work_mode">切换工作模式</button><button data-action="read">重读状态</button><button data-action="quit">结束验收</button></div><p id="error" role="alert"></p><div id="underlay">下层点击：<strong id="clicks">0</strong></div><p id="policy"></p><pre id="state" aria-live="polite"></pre></body></html>
