<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>班班原生交互探针</title><style>
html,body{margin:0;width:100%;height:100%;font:15px -apple-system,sans-serif;background:transparent;color:#1f3a5f;overflow:hidden}#underlay{display:none;background:#f6f3ec;height:100%;box-sizing:border-box;padding:24px}body.underlay #underlay{display:block}body.underlay #pet{display:none}#pet{position:absolute;width:112px;height:112px;left:40px;top:30px;cursor:grab;user-select:none;-webkit-user-select:none}#pet img{width:100%;height:100%;pointer-events:none}#status{white-space:pre-wrap}button{padding:10px;margin-right:10px}
</style><script src="/probe.js" defer></script></head><body><section id="underlay"><h1>班班隔离原生探针</h1><p>只使用合成页面，不初始化业务工作根。</p><p>下层点击：<strong id="clicks">0</strong></p><button id="show">显示班班</button><button id="hit">开启透明命中</button><button id="cancel-next">下次拖动中隐藏</button><button id="quit">结束探针</button><p><label>合成静态姿态 <select id="pose"><option value="idle">待机</option><option value="found">发现</option><option value="remind">提醒</option><option value="done">完成</option></select></label></p><pre id="status">透明命中尚未开启，先检查拖动。</pre></section><div id="pet" tabindex="0" aria-label="班班原生探针，可拖动或右击"><img src="/banban.svg" alt="班班" draggable="false"></div></body></html>
