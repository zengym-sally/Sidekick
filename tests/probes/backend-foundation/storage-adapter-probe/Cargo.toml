[package]
name = "sidekick-storage-adapter-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

# Isolated verification harness for the standalone Rust storage adapter described
# in docs/engineering/web-backend-design.md (connection + root lock, no-CREATE
# open, file identity, WAL/short transactions). It deliberately reuses the same
# dependency versions already locked for src-tauri so it can build offline from
# the shared cargo cache. It is NOT the production adapter and never touches a
# real workspace root: every scenario runs on a synthetic root created by the
# Node runner under build/backend-foundation/.

[dependencies]
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
serde_json = "=1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
keyring-core = "=1.0.1"
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
