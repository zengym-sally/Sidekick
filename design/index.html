<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>跟班 Sidekick · 设计索引</title>
<link rel="icon" href="../src/assets/brand/sidekick-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="../src/styles/tokens.css">
<style>
body{margin:0;padding:56px 32px;background:var(--ivory);color:var(--ink);font:13px/1.7 var(--font)}
main{max-width:760px;margin:auto}
img{width:60px;height:60px;vertical-align:middle;margin-right:12px}
h1{font-size:26px;line-height:1.4;letter-spacing:-.6px;margin:16px 0 8px}
p{color:var(--muted);margin:0 0 28px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
a{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:inherit;text-decoration:none}
a strong{display:block;font-size:14px;color:var(--ink)}
a span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
a:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
</style>
</head>
<body>
<main>
<img src="../src/assets/brand/sidekick-mark.svg" alt="班班简化标志">
<h1>设计索引</h1>
<p>静态设计预览，使用合成数据。生产界面与品牌资产以 <code>src/</code> 为准。</p>
<ul>
<li><a href="brand/"><strong>品牌板</strong><span>标志、桌宠四态、配色、字体与生产 SVG 资产</span></a></li>
<li><a href="prototype/"><strong>交互原型</strong><span>今日工作台、候选签收、事项处理、日报与配置流程</span></a></li>
<li><a href="layout-review/"><strong>布局评审原型</strong><span>设置、模型服务、智能体与公共控件</span></a></li>
<li><a href="web-task-flow/"><strong>任务队列交互方案</strong><span>W0：默认 3 并发、持久排队、取消中、失败、待核对与恢复核对；凭据与原生能力边界</span></a></li>
</ul>
</main>
</body>
</html>
