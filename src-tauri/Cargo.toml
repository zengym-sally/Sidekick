[package]
name = "sidekick"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "sidekick_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-autostart = "=2.5.1"
serde_json = "1"
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled", "backup"] }
rusqlite_migration = "=2.5.0"
keyring-core = "=1.0.1"
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
