[package]
name = "sidekick"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
# The package carries the implicit `sidekick` binary (src/main.rs) plus the
# approved `web-backend-storage` bin. Without this, `tauri build` cannot pick a
# main binary ("failed to find main binary, make sure you have a
# 'package > default-run'"). It stays the app binary; the storage adapter is
# built explicitly.
default-run = "sidekick"

[lib]
name = "sidekick_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-autostart = "=2.5.1"
serde_json = "1"
serde = { version = "=1.0.229", features = ["derive"] }
tauri-plugin-dialog = "=2.6.0"
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled", "backup"] }
rusqlite_migration = "=2.5.0"
keyring-core = "=1.0.1"
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
sha2 = "=0.10.9"

[features]
s33-mcp-verification = []
s33-mcp-ui-verification = []
pet-native-probe = []
pet-ui-verification = []

[[bin]]
name = "web-backend-storage"
path = "src/bin/web-backend-storage.rs"

[[example]]
name = "s33-mcp-host"
required-features = ["s33-mcp-verification"]

[[example]]
name = "pet-native-probe"
required-features = ["pet-native-probe"]

[[example]]
name = "pet-ui-verification"
required-features = ["pet-ui-verification"]
